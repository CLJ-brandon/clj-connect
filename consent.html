<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-+ls9/1C7oaIQ+f7tNotowHT6XNzM//aEN/sg4fvgFQM='; style-src 'unsafe-inline'; connect-src https://lieaqgpgftkizggrgxri.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>CLJ Connector Sign-in</title>
  <!--
    Sign-in + consent page for the CLJ Meta connector (Supabase Auth OAuth 2.1 server).
    Contains no secrets: the project URL and publishable key are public by design.
    Data access is enforced server-side (RLS, Google Internal app, domain check in the connector).
  -->
  <style>
    :root { --bg: #f7f5f1; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --line: #e4dfd6; --accent: #1f1d1a; --accent-ink: #ffffff; --err: #a3361f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --card: #211f1c; --ink: #f1ede6; --muted: #a39d93; --line: #35322d; --accent: #f1ede6; --accent-ink: #171614; --err: #e58a73; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 14px; color: var(--muted); }
    ul { margin: 0 0 20px; padding-left: 20px; color: var(--muted); }
    .who { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
    .row { display: flex; gap: 10px; }
    button { flex: 1; font: inherit; padding: 11px 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <main id="app"><p>Loading…</p></main>

  <!-- supabase-js 2.118.0 UMD build, vendored from the npm package (sha256 ee3be8de…3d3). No third-party CDN. -->
  <script src="./supabase-2.118.0.js"></script>
  <script>
    (() => {
    const SUPABASE_URL = "https://lieaqgpgftkizggrgxri.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3oaZ56xdwiqQwZQcb51ujg_qirpYf4O";
    const DOMAIN = "chrislovesjulia.com";
    // Sign-ins may only be handed back to Claude.
    const ALLOWED_REDIRECT_HOSTS = ["claude.ai", "claude.com"];

    const app = document.getElementById("app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const show = (html) => { app.innerHTML = html; };
    const fail = (msg) => show(`<h1>Can't connect</h1><p class="err">${esc(msg)}</p><p>Close this tab and try again from Claude. If it keeps happening, ask Brandon.</p>`);
    const hostOf = (u) => { try { return new URL(u).hostname.toLowerCase(); } catch { return ""; } };
    const toClaude = (u) => ALLOWED_REDIRECT_HOSTS.includes(hostOf(u));

    // Tab-scoped storage: the session lives only for this tab and is signed out after the decision.
    const store = {
      getItem: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
      setItem: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
      removeItem: (k) => { try { sessionStorage.removeItem(k); } catch {} },
    };

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true, storage: store, storageKey: "clj-connect-auth" },
    });
    const endSession = () => sb.auth.signOut({ scope: "local" }).catch(() => {});

    // Keep authorization_id across the Google round trip.
    const params = new URLSearchParams(location.search);
    let authorizationId = params.get("authorization_id");
    if (authorizationId) store.setItem("clj_authorization_id", authorizationId);
    else authorizationId = store.getItem("clj_authorization_id");

    async function run() {
      if (!authorizationId) return fail("This page only works as part of connecting Claude to a CLJ connector.");

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        const redirectTo = `${location.origin}${location.pathname}`;
        const { error } = await sb.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo, queryParams: { hd: DOMAIN, prompt: "select_account" } },
        });
        if (error) fail(error.message);
        return; // browser is redirecting to Google
      }

      const email = (session.user.email ?? "").toLowerCase();
      if (!email.endsWith(`@${DOMAIN}`)) {
        await endSession();
        return fail(`Signed in as ${email}. Use your @${DOMAIN} Google account.`);
      }

      const { data: details, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);
      if (error || !details) { await endSession(); return fail(error?.message ?? "This sign-in request has expired."); }

      // Already approved before: go straight back, but only to Claude.
      if (!("authorization_id" in details) && details.redirect_url) {
        store.removeItem("clj_authorization_id");
        await endSession();
        if (!toClaude(details.redirect_url)) return fail("This request isn't from Claude, so it was stopped.");
        return location.replace(details.redirect_url);
      }

      // Refuse any app that would send the sign-in somewhere other than Claude.
      const requestedHost = hostOf(details.redirect_uri);
      if (!ALLOWED_REDIRECT_HOSTS.includes(requestedHost)) {
        await sb.auth.oauth.denyAuthorization(authorizationId).catch(() => {});
        store.removeItem("clj_authorization_id");
        await endSession();
        return fail(`This request would send your sign-in to ${requestedHost || "an unknown site"}, not Claude, so it was stopped. Don't approve it, and let Brandon know.`);
      }

      show(`
        <h1>Connect Claude to CLJ</h1>
        <div class="who">Signed in as ${esc(email)} · returning to ${esc(requestedHost)}</div>
        <p>This lets Claude read CLJ's Instagram and Facebook data:</p>
        <ul>
          <li>Posts, captions and links</li>
          <li>Reach, likes, saves, shares and follower counts</li>
          <li>Comment text (no usernames)</li>
        </ul>
        <p>Read-only. Claude can't post, reply or change anything.</p>
        <div class="row">
          <button id="deny">Cancel</button>
          <button id="approve" class="primary">Allow</button>
        </div>`);

      const decide = async (approve) => {
        document.querySelectorAll("button").forEach((b) => (b.disabled = true));
        const fn = approve ? sb.auth.oauth.approveAuthorization : sb.auth.oauth.denyAuthorization;
        const { data, error } = await fn.call(sb.auth.oauth, authorizationId);
        store.removeItem("clj_authorization_id");
        await endSession();
        if (error) return fail(error.message);
        if (!toClaude(data.redirect_url)) return fail("Unexpected return address, so it was stopped. Let Brandon know.");
        location.replace(data.redirect_url);
      };
      document.getElementById("approve").onclick = () => decide(true);
      document.getElementById("deny").onclick = () => decide(false);
    }

    run().catch((e) => fail(e?.message ?? String(e)));
    })();
  </script>
</body>
</html>
